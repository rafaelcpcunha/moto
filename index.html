<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="tb" data-k="left"  style="left:2vw;bottom:4vh;width:15vw;height:22vh;font-size:34px">◀</div>
  <div class="tb" data-k="right" style="left:19vw;bottom:4vh;width:15vw;height:22vh;font-size:34px">▶</div>

  <div class="tb" data-k="pause" style="right:26vw;top:2vh;width:7vw;height:9vh">❚❚</div>
</div>
<script>
'use strict';
// =====================================================================
//  FÚRIA NO ASFALTO — corrida de combate em motos (pseudo-3D, canvas)
// =====================================================================
const W = 1280, H = 720, TAU = Math.PI * 2;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, b) => ((a % b) + b) % b;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
const overlap = (x1, w1, x2, w2) => !((x1 + w1 / 2) < (x2 - w2 / 2) || (x1 - w1 / 2) > (x2 + w2 / 2));
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
const FONT = '"Arial Black", Impact, "Segoe UI", sans-serif';
function txt(s, x, y, size, color, align = 'center', stroke = true, g = ctx) {
  g.font = `900 ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = Math.max(3, size / 7); g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
const fmtTime = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };

// ------------------------------------------------------------- constants
const SEG = 200, ROAD_W = 2000, RUMBLE = 3, DRAW_DIST = 270, CAM_H = 1000, FOV = 100;
const CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAM_H * CAM_DEPTH;
const STEP = 1 / 60;
const BASE_MAX = SEG / STEP;           // 12000 unidades/s
const BIKE_W = 240;                    // largura da moto em unidades do mundo
const PW = 0.085;                      // largura de colisão da moto (unidades de pista)
const CENTRIFUGAL = 0.24;
const KMH = 230;

const WEAPONS = {
  bat:   { name: 'TACO',     dmg: 24, reach: 0.37 },
  chain: { name: 'CORRENTE', dmg: 20, reach: 0.44 },
  pipe:  { name: 'CANO',     dmg: 28, reach: 0.35 },
};
const PLAYER_LOOK = { bike: '#ff6a00', jacket: '#1f1f22', helmet: '#f4f4f4', accent: '#ff2a2a', pants: '#25252d' };
const RIVAL_DEFS = [
  { name: 'Brasa',       bike: '#d63031', jacket: '#2c2c2c', helmet: '#f39c12', accent: '#f39c12', pants: '#3b2a20', skill: .90, aggr: .75, weapon: 'bat' },
  { name: 'Cobra',       bike: '#1e9e55', jacket: '#14361f', helmet: '#2ecc71', accent: '#a3ff6b', pants: '#1d2b20', skill: .80, aggr: .95, weapon: 'chain' },
  { name: 'Dona Faísca', bike: '#f1c40f', jacket: '#5b3a1a', helmet: '#ffffff', accent: '#ff7b00', pants: '#2b2b33', skill: 1.0, aggr: .40, weapon: null },
  { name: 'Tatu',        bike: '#95a5a6', jacket: '#4a4a4a', helmet: '#6f7c7d', accent: '#d0d0d0', pants: '#33333a', skill: .62, aggr: .65, weapon: 'pipe' },
  { name: 'Zé Turbina',  bike: '#2f80ed', jacket: '#1a2b4c', helmet: '#ecf0f1', accent: '#56ccf2', pants: '#1c1f2b', skill: .86, aggr: .50, weapon: null },
  { name: 'Lobo',        bike: '#7d3cab', jacket: '#222222', helmet: '#555555', accent: '#b07de0', pants: '#20202a', skill: .76, aggr: 1.0, weapon: 'bat' },
  { name: 'Neon',        bike: '#ff4fd8', jacket: '#2a0f3a', helmet: '#00f0ff', accent: '#00f0ff', pants: '#24132e', skill: .95, aggr: .60, weapon: 'chain' },
];
const PRIZES = [1000, 650, 420, 250, 150, 100, 60, 40];
const KO_BONUS = 150;
const UPGRADES = [
  { k: 'engine', name: 'MOTOR',     desc: 'Mais velocidade máxima e arrancada', cost: [500, 1100, 2000] },
  { k: 'tires',  name: 'PNEUS',     desc: 'Curvas mais firmes e menos perda na terra', cost: [400, 900, 1600] },
  { k: 'armor',  name: 'BLINDAGEM', desc: 'Mais vigor e menos dano nas quedas', cost: [450, 1000, 1800] },
  { k: 'nitro',  name: 'NITRO',     desc: 'Tanque maior e recarga mais rápida', cost: [350, 800, 1500] },
];

// ---------------------------------------------------------------- save
const SAVE_KEY = 'furia-asfalto-v1';
let save = { money: 0, up: { engine: 0, tires: 0, armor: 0, nitro: 0 }, unlocked: 1, best: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.up) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// =====================================================================
//  ÁUDIO (sintetizado com WebAudio)
// =====================================================================
const Snd = {
  ac: null, muted: false, musicOn: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = this.ac = new AC();
    this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.6; this.master.connect(ac.destination);
    this.sfx = ac.createGain(); this.sfx.connect(this.master);
    this.mus = ac.createGain(); this.mus.gain.value = 0.2; this.mus.connect(this.master);
    const len = ac.sampleRate; const b = ac.createBuffer(1, len, ac.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
    // motor
    this.engGain = ac.createGain(); this.engGain.gain.value = 0;
    this.engLP = ac.createBiquadFilter(); this.engLP.type = 'lowpass'; this.engLP.frequency.value = 900; this.engLP.Q.value = 3;
    this.o1 = ac.createOscillator(); this.o1.type = 'sawtooth';
    this.o2 = ac.createOscillator(); this.o2.type = 'square';
    const g2 = ac.createGain(); g2.gain.value = 0.45;
    this.o1.connect(this.engLP); this.o2.connect(g2); g2.connect(this.engLP); this.engLP.connect(this.engGain); this.engGain.connect(this.sfx);
    this.o1.frequency.value = 60; this.o2.frequency.value = 30;
    this.o1.start(); this.o2.start();
    this.step = 0; this.nextT = ac.currentTime + 0.1;
    setInterval(() => this.sched(), 25);
  },
  engine(rpm, vol) {
    if (!this.ac) return; const t = this.ac.currentTime; const f = 42 + rpm * 135;
    this.o1.frequency.setTargetAtTime(f, t, 0.04); this.o2.frequency.setTargetAtTime(f * 0.5 + 2.5, t, 0.04);
    this.engLP.frequency.setTargetAtTime(400 + rpm * 1900, t, 0.05); this.engGain.gain.setTargetAtTime(vol, t, 0.08);
  },
  noise(dur, freq, vol, type = 'lowpass', endFreq = 0, delay = 0, dest = null) {
    if (!this.ac) return; const ac = this.ac, t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
    if (endFreq) f.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  tone(freq, dur, type, vol, endFreq = 0, delay = 0, dest = null) {
    if (!this.ac) return; const ac = this.ac, t = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  punch() { this.noise(0.12, 900, 0.9); this.tone(150, 0.12, 'sine', 0.8, 45); },
  whack() { this.noise(0.2, 2600, 0.7, 'bandpass', 500); this.tone(560, 0.16, 'square', 0.22, 160); this.tone(120, 0.1, 'sine', 0.6, 50); },
  swing() { this.noise(0.12, 1800, 0.25, 'highpass'); },
  crash() { this.noise(1.0, 1600, 1.0, 'lowpass', 180); this.tone(95, 0.7, 'sawtooth', 0.35, 28); this.noise(0.4, 4000, 0.4, 'highpass', 0, 0.15); },
  bump() { this.noise(0.15, 500, 0.7); this.tone(80, 0.12, 'sine', 0.5, 40); },
  beep(hi) { this.tone(hi ? 880 : 440, hi ? 0.55 : 0.2, 'square', 0.22); },
  pickup() { this.tone(660, 0.08, 'square', 0.18); this.tone(990, 0.18, 'square', 0.18, 0, 0.08); },
  ko() { this.tone(300, 0.1, 'square', 0.18); this.tone(450, 0.1, 'square', 0.18, 0, 0.09); this.tone(700, 0.25, 'square', 0.18, 0, 0.18); },
  nitro() { this.noise(0.7, 300, 0.45, 'bandpass', 3500); },
  click() { this.tone(500, 0.05, 'square', 0.12); },
  cash() { this.tone(1200, 0.06, 'square', 0.15); this.tone(1600, 0.2, 'square', 0.15, 0, 0.07); },
  setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.6; },
  // sequenciador da trilha
  sched() {
    const ac = this.ac; if (!ac) return;
    const sp = 60 / 140 / 4;
    if (this.nextT < ac.currentTime - 0.2) this.nextT = ac.currentTime + 0.05;
    while (this.nextT < ac.currentTime + 0.12) {
      if (this.musicOn) this.playStep(this.step, this.nextT - ac.currentTime, sp);
      this.nextT += sp; this.step = (this.step + 1) % 64;
    }
  },
  playStep(s, d, sp) {
    const st = s % 16, bar = Math.floor(s / 16), M = this.mus;
    const roots = [45, 45, 41, 43];
    if (st % 4 === 0) this.tone(150, 0.16, 'sine', 0.9, 40, d, M);
    if (st === 4 || st === 12) { this.noise(0.14, 1800, 0.45, 'highpass', 0, d, M); this.tone(210, 0.08, 'triangle', 0.3, 120, d, M); }
    if (st % 2 === 1) this.noise(0.035, 8000, 0.18, 'highpass', 0, d, M);
    const pat = [0, 0, 12, 0, 0, 12, 0, 10, 0, 0, 12, 0, 7, 0, 10, 12];
    const midi = roots[bar] + pat[st] - 12;
    this.tone(440 * Math.pow(2, (midi - 69) / 12), sp * 0.9, 'sawtooth', 0.22, 0, d, M);
    if (bar === 3 && st >= 12) this.tone(440 * Math.pow(2, (roots[bar] + 24 + [0, 3, 5, 7][st - 12] - 69) / 12), sp * 0.8, 'square', 0.07, 0, d, M);
  },
};

// =====================================================================
//  ENTRADA (teclado, gamepad, toque)
// =====================================================================
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'atkL', KeyJ: 'atkL', KeyX: 'atkR', KeyL: 'atkR', ShiftLeft: 'nitro', ShiftRight: 'nitro', Space: 'nitro',
  Enter: 'ok', NumpadEnter: 'ok', Escape: 'pause', KeyP: 'pause', KeyM: 'mute', KeyG: 'garage', KeyQ: 'quit', Backspace: 'quit', KeyF: 'full',
};
const kb = {}, pad = {}, tch = {}, pressed = {};
let padSteer = 0, padPrev = {};
const inp = a => !!(kb[a] || pad[a] || tch[a]);
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return; e.preventDefault(); Snd.init();
  if (!e.repeat) pressed[a] = true; kb[a] = true;
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) kb[a] = false; });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; });
addEventListener('pointerdown', () => Snd.init());
function pollPad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null; for (const g of gps) if (g) { gp = g; break; }
  for (const k in pad) pad[k] = false; padSteer = 0;
  if (!gp) return;
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const ax = gp.axes[0] || 0; padSteer = Math.abs(ax) > 0.18 ? ax : 0;
  pad.left = ax < -0.5 || b(14); pad.right = ax > 0.5 || b(15);
  pad.up = b(7) || b(0); pad.down = b(6) || b(13); pad.atkL = b(2) || b(4); pad.atkR = b(1) || b(5);
  pad.nitro = b(3); pad.ok = b(0) || b(9); pad.pause = b(9); pad.garage = b(8);
  for (const k in pad) { if (pad[k] && !padPrev[k]) pressed[k] = true; }
  padPrev = Object.assign({}, pad);
}
(function setupTouch() {
  const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  if (!isTouch) return;
  const root = document.getElementById('touch'); root.classList.add('on');
  root.querySelectorAll('.tb').forEach(el => {
    const k = el.dataset.k;
    const on = e => { e.preventDefault(); Snd.init(); if (!tch[k]) pressed[k] = true; tch[k] = true; el.classList.add('act'); };
    const off = e => { e.preventDefault(); tch[k] = false; el.classList.remove('act'); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
  });
})();

// =====================================================================
//  SPRITES (pré-renderizados proceduralmente)
// =====================================================================
const SPR = {};
function defSprite(key, img, ww, cw, ax = 0.5) { SPR[key] = { img, ww, cw, ax }; }

function cactusImg(seed) {
  const r = rng(seed);
  return mk(200, 360, (g, w, h) => {
    g.lineCap = 'round'; g.lineJoin = 'round';
    const tx = w / 2, top = 32;
    const la = { y: h * (0.45 + r() * 0.15), x: w * 0.18, top: h * (0.2 + r() * 0.12) };
    const ra = { y: h * (0.36 + r() * 0.15), x: w * 0.82, top: h * (0.14 + r() * 0.1) };
    const hasL = r() < 0.85, hasR = r() < 0.85;
    const path = () => {
      g.beginPath(); g.moveTo(tx, h - 8); g.lineTo(tx, top);
      if (hasL) { g.moveTo(tx, la.y); g.lineTo(la.x + 14, la.y); g.quadraticCurveTo(la.x, la.y, la.x, la.y - 16); g.lineTo(la.x, la.top); }
      if (hasR) { g.moveTo(tx, ra.y); g.lineTo(ra.x - 14, ra.y); g.quadraticCurveTo(ra.x, ra.y, ra.x, ra.y - 16); g.lineTo(ra.x, ra.top); }
    };
    g.strokeStyle = '#1d4a22'; g.lineWidth = 54; path(); g.stroke();
    g.strokeStyle = '#3c8a3b'; g.lineWidth = 44; path(); g.stroke();
    g.strokeStyle = '#2d6e30'; g.lineWidth = 3; g.save(); g.translate(9, 0); path(); g.stroke(); g.translate(-18, 0); path(); g.stroke(); g.restore();
    g.strokeStyle = 'rgba(160,230,120,.55)'; g.lineWidth = 8; g.save(); g.translate(-12, 0); path(); g.stroke(); g.restore();
  });
}
function rockImg(seed, c1, c2, c3) {
  const r = rng(seed);
  return mk(300, 190, (g, w, h) => {
    const pts = []; const n = 11;
    for (let i = 0; i < n; i++) {
      const a = Math.PI + (i / (n - 1)) * Math.PI; const rad = 0.75 + r() * 0.3;
      pts.push([w / 2 + Math.cos(a) * w * 0.46 * rad, h - 6 + Math.sin(a) * h * 0.9 * rad]);
    }
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(w / 2, h - 8, w * 0.48, 10, 0, 0, TAU); g.fill();
    g.fillStyle = c1; g.beginPath(); g.moveTo(pts[0][0], h - 6); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(pts[n - 1][0], h - 6); g.closePath(); g.fill();
    g.fillStyle = c2; g.beginPath(); g.moveTo(pts[1][0] + 10, pts[1][1] + 20);
    for (let i = 1; i < n - 3; i++) g.lineTo(pts[i][0] + 6, pts[i][1] + 12); g.lineTo(w * 0.45, h * 0.6); g.closePath(); g.fill();
    g.fillStyle = c3; g.beginPath(); g.moveTo(w * 0.62, h - 6);
    for (let i = n - 4; i < n; i++) g.lineTo(pts[i][0], pts[i][1]); g.lineTo(pts[n - 1][0], h - 6); g.closePath(); g.fill();
  });
}
function poleImg() {
  return mk(90, 520, (g, w, h) => {
    g.fillStyle = '#5a3d22'; g.fillRect(38, 20, 14, h - 20);
    g.fillStyle = '#4a311b'; g.fillRect(6, 44, 78, 9); g.fillRect(16, 74, 58, 7);
    g.fillStyle = '#d9e4ea'; [12, 30, 60, 78].forEach(x => { g.fillRect(x - 3, 34, 6, 10); });
  });
}
function deadTreeImg(seed) {
  const r = rng(seed);
  return mk(260, 330, (g, w, h) => {
    g.strokeStyle = '#4b3423'; g.lineCap = 'round';
    const br = (x, y, a, len, wd, d) => {
      if (d > 5 || len < 8) return;
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      g.lineWidth = wd; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
      const k = 1 + Math.floor(r() * 2);
      for (let i = 0; i <= k; i++) br(x2, y2, a + (r() - 0.5) * 1.3, len * (0.6 + r() * 0.2), wd * 0.65, d + 1);
    };
    br(w / 2, h - 4, -Math.PI / 2, 95, 18, 0);
  });
}
function billboardImg(title, sub, bg, fg) {
  return mk(560, 380, (g, w, h) => {
    g.fillStyle = '#2b2b2b'; g.fillRect(120, 200, 18, h - 200); g.fillRect(w - 138, 200, 18, h - 200);
    g.fillStyle = '#1a1a1a'; g.fillRect(4, 14, w - 8, 206);
    g.fillStyle = bg; g.fillRect(14, 24, w - 28, 186);

function ridgeLayer(top, bottom, base, amp, freqs, seed) {
  return mk(W * 2, H, (g, w, h) => {
    const r = rng(seed); const comps = freqs.map(f => ({ f, a: 0.4 + r() * 0.6, p: r() * TAU }));
    const tot = comps.reduce((s, c) => s + c.a, 0);
    const gr = g.createLinearGradient(0, base - amp * 2, 0, base + 20); gr.addColorStop(0, top); gr.addColorStop(1, bottom);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 4) { let y = 0; for (const c of comps) y += Math.sin(x / w * TAU * c.f + c.p) * c.a; g.lineTo(x, base - amp * (1 + y / tot)); }
    g.lineTo(w, h); g.closePath(); g.fill();
  });
}
function mesaLayer(col, col2, base, seed) {
  return mk(W * 2, H, (g, w, h) => {
    const r = rng(seed);
    g.fillStyle = col; g.fillRect(0, base, w, h - base);
    for (let i = 0; i < 10; i++) {
      const cx = r() * w, mw = 90 + r() * 260, mh = 40 + r() * 120;
      for (const off of [-w, 0, w]) {
        const x = cx + off;
        g.fillStyle = col; g.beginPath(); g.moveTo(x - mw / 2 - 30, base + 2); g.lineTo(x - mw / 2, base - mh); g.lineTo(x + mw / 2, base - mh); g.lineTo(x + mw / 2 + 30, base + 2); g.closePath(); g.fill();
        g.fillStyle = col2; g.fillRect(x - mw / 2, base - mh, mw, 6);
      }
    }
  });
}
function skylineLayer(body, base, minH, maxH, seed, lit, neon) {
  return mk(W * 2, H, (g, w, h) => {
    const r = rng(seed);
    g.fillStyle = body; g.fillRect(0, base, w, h - base);
    let x = 0;
    while (x < w) {
      const bw = Math.min(w - x, 40 + r() * 110), bh = minH + r() * (maxH - minH);
      if (bw < 20) break;
      g.fillStyle = body; g.fillRect(x, base - bh, bw - 4, bh + 2);
      if (r() < 0.3) { g.fillRect(x + bw * 0.3, base - bh - 18, bw * 0.3, 18); }
      if (r() < 0.25) { g.fillRect(x + bw / 2 - 1, base - bh - 40, 3, 40); g.fillStyle = '#ff4040'; g.fillRect(x + bw / 2 - 2, base - bh - 42, 5, 4); }
      for (let wy = base - bh + 8; wy < base - 6; wy += 11)
        for (let wx = x + 5; wx < x + bw - 10; wx += 9)
          if (r() < lit) { g.fillStyle = r() < 0.8 ? '#ffd57a' : '#a8e6ff'; g.fillRect(wx, wy, 4, 5); }
      if (neon && r() < 0.18) { g.fillStyle = pick(r, ['#ff3df2', '#3df5ff', '#ffea3d']); g.fillRect(x, base - bh, bw - 4, 3); }
      x += bw;
    }
  });
}

let segments = [], L = 0, theme = THEMES.desert, themeKey = 'desert';
let traffic = [];
const touched = [];
const labels = [];
const findSeg = z => segments[Math.floor(mod(z, L) / SEG) % segments.length];
const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n, curve, sprites: [], ents: [], clip: 0, looped: false, fog: 1, banner: null,
    color: Math.floor(n / RUMBLE) % 2 ? 'dark' : 'light',
    p1: { world: { x: 0, y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { x: 0, y, z: (n + 1) * SEG }, camera: {}, screen: {} },

}
function addRoad(enter, hold, leave, curve, y) {
  enter = Math.round(enter); hold = Math.round(hold); leave = Math.round(leave);
  const sy = lastY(), ey = sy + Math.round(y) * SEG, tot = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(sy, ey, n / tot));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(sy, ey, (enter + n) / tot));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(sy, ey, (enter + hold + n) / tot));
}
function buildTrack(key) {
  theme = THEMES[key]; themeKey = key; segments = [];
  const T = theme.track, r = rng(theme.seed);
  addRoad(0, 70, 0, 0, 0);
  while (segments.length < T.len) {
    const p = r(), len = T.seg[0] + r() * (T.seg[1] - T.seg[0]);
    let hill = r() < T.pHill ? (r() * 2 - 1) * T.hill : 0;
    const ly = lastY() / SEG; if (Math.abs(ly) > T.hill * 2.5) hill = -Math.sign(ly) * Math.abs(hill || T.hill * 0.5);
    const curve = (r() < 0.5 ? -1 : 1) * (T.curve[0] + r() * (T.curve[1] - T.curve[0]));
    if (p < T.pStraight) addRoad(len, len, len, 0, hill);
    else if (p < T.pStraight + T.pCurve) addRoad(len, len * (0.6 + r()), len, curve, hill);
    else if (p < T.pStraight + T.pCurve + T.pS) { addRoad(len * 0.6, len * 0.5, len * 0.6, curve, hill / 2); addRoad(len * 0.6, len * 0.5, len * 0.6, -curve, -hill / 2); }
    else { for (let k = 0; k < 4; k++) addRoad(len / 3, len / 3, len / 3, curve * 0.25, (k % 2 ? -1 : 1) * T.hill * 0.4); }
  }
  addRoad(40, 40, 40, 0, -lastY() / SEG);
  addRoad(0, 90, 0, 0, 0);
  L = segments.length * SEG;
  // cenário
  const rs = rng(theme.seed + 99);
  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    const add = (k, o) => s.sprites.push({ k, o });
    theme.place(rs, i, s, add);
    if (Math.abs(s.curve) > 2.6 && i % 8 === 0 && key !== 'city') add(s.curve > 0 ? 'chevR' : 'chevL', s.curve > 0 ? -1.4 : 1.4);
    if (Math.abs(s.curve) > 2.6 && i % 10 === 0 && key === 'city') add(s.curve > 0 ? 'chevR' : 'chevL', s.curve > 0 ? -1.22 : 1.22);
  }
  const startIdx = 30, finishIdx = segments.length - 40;
  segments[startIdx].banner = 'LARGADA';
  segments[finishIdx].banner = 'CHEGADA';
  // limpa cenário colado nas faixas das largadas
  for (const idx of [startIdx, finishIdx]) segments[idx].sprites = segments[idx].sprites.filter(sp => Math.abs(sp.o) > 2);

}
function laneX(i) { return -1 + (2 * i + 1) / theme.lanes; }
function makeTraffic() {
  traffic = []; const r = rng(theme.seed + 5);
  const n = Math.floor(segments.length / theme.traffic);
  for (let i = 0; i < n; i++) {
    const lane = Math.floor(r() * theme.lanes);
    const dir = lane < theme.lanes / 2 ? -1 : 1;
    const def = CARS[Math.floor(r() * CARS.length)];
    traffic.push({
      kind: 'car', def, dir, lane, x: laneX(lane) + (r() - 0.5) * 0.1,
      z: (60 + r() * (segments.length - 60)) * SEG,
      speed: BASE_MAX * (dir > 0 ? 0.22 + r() * 0.2 : 0.25 + r() * 0.2),
    });

}

// --------------------------------------------------------- mensagens/fx
function addMsg(text, color = '#fff', size = 46, dur = 1.6) { R.msgs.push({ text, color, size, t: 0, dur }); if (R.msgs.length > 4) R.msgs.shift(); }
function spawn(x, y, n, type, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (type === 'spark' ? 120 : 30), life: 0,
      max: type === 'dust' ? 0.6 + Math.random() * 0.4 : 0.35 + Math.random() * 0.4,
      size: type === 'dust' ? 8 + Math.random() * 14 : type === 'star' ? 10 + Math.random() * 8 : 2 + Math.random() * 2,
      type, color,

  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'spark') p.vy += 900 * dt;
    if (p.type === 'dust') { p.vy += 40 * dt; p.vx *= 0.96; p.size += 30 * dt; }

}
function drawParts() {

    const a = 1 - p.life / p.max;

    } else if (p.type === 'star') {

      ctx.beginPath(); for (let k = 0; k < 10; k++) { const rr2 = k % 2 ? p.size * 0.45 : p.size; const an = k / 10 * TAU; ctx.lineTo(Math.cos(an) * rr2, Math.sin(an) * rr2); }

}

function crashPlayer(msg) {
  if (P.crash) return;
  const up = save.up;
  P.crash = { t: 0, side: Math.random() < 0.5 ? -1 : 1, sp: P.speed / BASE_MAX, slide: 0 };
  P.dmg = Math.min(100, P.dmg + (10 + 12 * P.speed / BASE_MAX) * (1 - 0.13 * up.armor));

}
function hitPlayer(dmg, side, weapon) {
  P.hp -= dmg * (1 - 0.12 * save.up.armor); P.hitT = 0.35; P.x += side * 0.07; P.speed *= 0.97;
  R.shake = Math.max(R.shake, 0.5); R.flash = 0.18;

function rivalDown(r, byPlayer) {

  if (byPlayer || R.time - r.lastHit < 2.5) {

    if (r.weapon && Math.abs(r.d - P.d) < 500 && !P.crash) {
      P.weapon = r.weapon; addMsg('PEGOU: ' + WEAPONS[r.weapon].name + '!', '#7bed9f', 34); r.weapon = null; Snd.pickup();
    }
  }
  spawn(r.sx, r.sy - r.sw * 0.6, 14, 'spark');
}
function playerAttackHit() {
  const a = P.attack, wp = P.weapon ? WEAPONS[P.weapon] : null;
  const reach = wp ? wp.reach : (a.kick ? 0.32 : 0.29);
  let best = null, bd = 1e9;
  for (const r of rivals) {
    if (r.down) continue;
    const dz = r.d - P.d; if (dz < -240 || dz > 270) continue;
    const dx = r.x - P.x; if (dx * a.side < 0.02 || Math.abs(dx) > reach) continue;
    const dd = Math.abs(dz) + Math.abs(dx) * 1000; if (dd < bd) { bd = dd; best = r; }
  }
  if (!best) { Snd.swing(); return; }
  const dmg = wp ? wp.dmg : (a.kick ? 11 : 14);
  best.hp -= dmg; best.x += a.side * (a.kick ? 0.2 : wp ? 0.12 : 0.08); best.hitT = 0.3; best.lastHit = R.time; best.speed *= 0.95;
  best.atkCd = Math.min(best.atkCd, 0.35 + Math.random() * 0.5);
  wp ? Snd.whack() : Snd.punch();
  R.shake = Math.max(R.shake, 0.3);
  spawn(best.sx, best.sy - best.sw * 1.25, wp ? 9 : 6, 'star', wp ? '#ffffff' : '#ffe14d');
  if (best.hp <= 0) { best.hp = 0; rivalDown(best, true); }
}
function canControl() { return R.countdown <= 0 && !P.crash && !P.finished && !R.over; }

function updatePlayer(dt) {
  const up = save.up, seg = findSeg(P.d);
  const handling = 1 + 0.12 * up.tires;
  let steer = 0, gas = false, brake = false, nkey = false;
  if (canControl()) {
    steer = (inp('left') ? -1 : 0) + (inp('right') ? 1 : 0);
    if (!steer && padSteer) steer = clamp(padSteer * 1.2, -1, 1);
    gas = inp('up'); brake = inp('down'); nkey = inp('nitro');
  }
  if (P.finished) { gas = P.speed < BASE_MAX * 0.55; steer = clamp((0.4 - P.x) * 2, -1, 1); }
  P.nitroOn = nkey && P.nitro > 1 && P.speed > BASE_MAX * 0.15;
  if (P.nitroOn) { P.nitro = Math.max(0, P.nitro - 30 * dt); if (!P.nitroWas) Snd.nitro(); }
  else P.nitro = Math.min(P.nitroMax, P.nitro + (4 + 2 * up.nitro) * dt);
  P.nitroWas = P.nitroOn;
  const maxS = pMax() * (P.nitroOn ? 1.32 : 1);
  const spdPct = P.speed / BASE_MAX, dx = dt * 2 * spdPct;
  if (!P.crash) {
    P.x += steer * dx * 1.25 * handling;
    P.x -= dx * spdPct * seg.curve * CENTRIFUGAL * (1 - 0.1 * up.tires);
    if (R.countdown > 0) P.speed = 0;
    else if (gas) P.speed += (BASE_MAX / 4.6) * (1 + 0.08 * up.engine) * (P.nitroOn ? 1.7 : 1) * Math.max(0.15, 1.15 - 0.8 * P.speed / maxS) * dt;
    else if (brake) P.speed -= BASE_MAX * 1.15 * dt;
    else P.speed -= BASE_MAX * 0.17 * dt;
    if (Math.abs(P.x) > 1) {
      const lim = BASE_MAX * (0.3 + 0.07 * up.tires);
      if (P.speed > lim) P.speed -= BASE_MAX * 0.95 * dt;
      if (P.speed > 1500 && Math.random() < 0.6) spawn(W / 2 + (Math.random() - 0.5) * 60, H - 30, 1, 'dust', theme === THEMES.city ? 'rgba(150,150,160,A)' : 'rgba(205,160,105,A)');
    }
    if (P.speed > maxS) P.speed = Math.max(maxS, P.speed - BASE_MAX * 0.4 * dt);
    P.speed = Math.max(0, P.speed);
  } else {
    P.speed = Math.max(0, P.speed - BASE_MAX * 0.85 * dt);
    P.crash.t += dt; P.crash.slide += P.crash.side * P.speed * dt * 0.012;
    if (P.speed > 800 && Math.random() < 0.7) spawn(W / 2 + P.crash.slide, H - 40, 2, 'spark');

      if (P.dmg >= 100) { if (!R.over) endRace(true); }

        P.crash = null; P.x = clamp(P.x, -0.8, 0.8); P.speed = 0;

  P.x = clamp(P.x, -3, 3);
  const prevD = P.d;
  P.d += P.speed * dt;
  P.tread += P.speed * dt * 0.05;

  P.invuln = Math.max(0, P.invuln - dt); P.hitT = Math.max(0, P.hitT - dt); P.bumpCd = Math.max(0, P.bumpCd - dt);
  if (Math.abs(P.x) > 1 && P.speed > 300) P.wob = (Math.random() - 0.5) * 6; else P.wob = 0;

    const side = pressed.atkL ? -1 : pressed.atkR ? 1 : 0;
    if (side) {
      const kick = !P.weapon && (P.atkCount++ % 3 === 2);
      P.attack = { side, t: 0, dur: P.weapon ? 0.36 : 0.3, hit: false, kick, e: 0 };
      P.atkCd = P.weapon ? 0.48 : 0.36;

        if (rel <= 0) continue;

        else if (P.bumpCd <= 0) {
          P.speed = car.speed * 0.8; P.x += P.x < car.x ? -0.06 : 0.06; P.bumpCd = 0.4;

  }

function updateRival(r, dt) {

  }

  const seg = findSeg(r.d), dzP = r.d - P.d;
  let tgt = r.max * (1 - Math.min(0.22, Math.abs(seg.curve) * 0.028));
  tgt *= clamp(1 - dzP / 18000, 0.88, 1.25);
  if (R.countdown > 0) tgt = 0;

  if (Math.abs(r.x) > 1) tgt = Math.min(tgt, BASE_MAX * 0.3);

function placeOf() {
  let p = 1;

}
function endRace(wrecked) {
  R.over = wrecked ? 'wrecked' : 'finished';
  const pos = wrecked ? null : placeOf();
  const prize = wrecked ? 0 : Math.round(PRIZES[pos - 1] * theme.prizeMul);
  const koCash = P.ko * KO_BONUS;
  save.money += prize + koCash;
  const ti = THEME_ORDER.indexOf(themeKey);
  let unlockedNew = null;
  if (!wrecked && pos <= 3 && save.unlocked < ti + 2 && ti + 1 < THEME_ORDER.length) { save.unlocked = ti + 2; unlockedNew = THEMES[THEME_ORDER[ti + 1]].name; }
  if (!wrecked) { const b = save.best[themeKey]; if (!b || pos < b.pos || (pos === b.pos && R.finishT < b.time)) save.best[themeKey] = { pos, time: R.finishT }; }

  const list = rivals.map(r => ({ name: r.name, color: r.bike, fin: r.finishT, d: r.d, me: false }));
  list.push({ name: 'VOCÊ', color: PLAYER_LOOK.bike, fin: wrecked ? null : R.finishT, d: wrecked ? -1 : P.d, me: true });
  list.sort((a, b) => (a.fin != null && b.fin != null) ? a.fin - b.fin : (a.fin != null ? -1 : b.fin != null ? 1 : b.d - a.d));
  R.result = { wrecked, pos, prize, koCash, ko: P.ko, list, unlockedNew, time: R.finishT };
  R.endT = 0;
}

function updateRace(dt) {
  if (pressed.pause) { game.state = 'pause'; Snd.click(); return; }
  if (R.countdown > 0) {
    R.countdown -= dt;
    const c = Math.ceil(R.countdown);
    if (c < R.lastBeep) { R.lastBeep = c; Snd.beep(c <= 0); if (c <= 0) addMsg('VAI!', '#7bed9f', 90, 1.0); }
  } else R.time += dt;
  updatePlayer(dt);
  for (const r of rivals) updateRival(r, dt);
  for (const car of traffic) car.z = mod(car.z + car.speed * car.dir * dt, L);
  if (!P.finished && !R.over && P.d >= R.finishD) {
    P.finished = true; R.finishT = R.time;
    const pos = placeOf();
    addMsg(pos === 1 ? 'VITÓRIA!' : `CHEGADA: ${pos}º LUGAR`, pos <= 3 ? '#ffd23f' : '#fff', 64, 3);
    endRace(false);
  }
  if (R.over) { R.endT += dt; if (R.endT > 3.2) { game.state = 'results'; Snd.musicOn = false; } }
  for (const m of R.msgs) m.t += dt;
  R.msgs = R.msgs.filter(m => m.t < m.dur);
  R.shake = Math.max(0, R.shake - dt * 2.5); R.flash = Math.max(0, R.flash - dt);
  updateParts(dt);
}

    drawBike(ctx, sx + shakeX, sy, bw, { bike: e.bike, jacket: e.jacket, helmet: e.helmet, accent: e.accent, pants: e.pants, lean: e.lean, atk: e.atk, weapon: e.weapon, tread: e.tread, brake: e.speed < BASE_MAX * 0.2, alpha: e.invuln > 0 ? 0.6 : null });
    const hy = sy - bw * 1.72, hw = Math.max(40, bw * 0.75);
    if (e.relZ < 3200 && bw > 30 && !needClip && !labels.some(l => Math.abs(l[0] - sx) < 90 && Math.abs(l[1] - hy) < 34)) {
      labels.push([sx, hy]);
      txt(e.name, sx, hy - 12, Math.max(11, Math.min(18, bw * 0.12)), e.weapon ? '#ffb3a7' : '#fff');
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(sx - hw / 2 - 2, hy - 2, hw + 4, 8);
      const pct = e.hp / e.hpMax; ctx.fillStyle = pct > 0.5 ? '#2ecc71' : pct > 0.25 ? '#f1c40f' : '#e74c3c';
      ctx.fillRect(sx - hw / 2, hy, hw * pct, 4);
    }
  }
  if (needClip) ctx.restore();
}

function renderWorld(camZ, camXu, drawPlayer) {
  const A = themeAssets(theme);
  ctx.drawImage(A.sky, 0, 0);
  A.layers.forEach(l => drawLayer(l.img, bgScroll * l.f));
  const N = segments.length;
  const base = findSeg(camZ), basePct = mod(camZ, SEG) / SEG;
  const pz = camZ + PLAYER_Z, pSeg = findSeg(pz), pPct = mod(pz, SEG) / SEG;
  const playerY = lerp(pSeg.p1.world.y, pSeg.p2.world.y, pPct);
  const camY = playerY + CAM_H, camX = camXu * ROAD_W;
  // entidades nos segmentos
  for (const s of touched) s.ents.length = 0; touched.length = 0; labels.length = 0;
  const addEnt = e => { const s = findSeg(e.z); e.relZ = mod(e.z - camZ, L); if (e.relZ > DRAW_DIST * SEG) return; s.ents.push(e); touched.push(s); };
  traffic.forEach(addEnt);
  if (game.state !== 'menu' && game.state !== 'garage') rivals.forEach(addEnt);
  let maxy = H, x = 0, dx = -(base.curve * basePct);
  for (let n = 0; n < DRAW_DIST; n++) {
    const seg = segments[(base.index + n) % N];
    seg.looped = seg.index < base.index;
    const dd = n / DRAW_DIST; seg.fog = 1 / Math.pow(Math.E, dd * dd * theme.fogD);
    seg.clip = maxy;
    const cz = camZ - (seg.looped ? L : 0);
    project(seg.p1, camX - x, camY, cz);
    project(seg.p2, camX - x - dx, camY, cz);
    x += dx; dx += seg.curve;
    if (seg.p1.camera.z <= CAM_DEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    renderSegment(seg);
    maxy = seg.p1.screen.y;
  }
  const pN = mod(pSeg.index - base.index, N);
  let pDrawn = !drawPlayer;
  const py = lerp(pSeg.p1.screen.y, pSeg.p2.screen.y, pPct);
  for (let n = DRAW_DIST - 1; n > 0; n--) {
    const seg = segments[(base.index + n) % N];
    const alpha = n > DRAW_DIST * 0.8 ? (DRAW_DIST - n) / (DRAW_DIST * 0.2) : 1;
    for (const sp of seg.sprites) drawScenery(seg, sp, alpha);
    if (seg.banner) drawBanner(seg);
    if (seg.ents.length) {
      seg.ents.sort((a, b) => b.relZ - a.relZ);
      for (const e of seg.ents) {
        if (!pDrawn && e.relZ < PLAYER_Z) { drawPlayer(py); pDrawn = true; }
        drawEnt(seg, e);
      }
    }
    if (n === pN && !pDrawn) { drawPlayer(py); pDrawn = true; }
  }
  if (!pDrawn) drawPlayer(py);
}

function drawPlayerBike(py) {
  const bw = BIKE_W / CAM_H * W / 2;
  const y = py - 12 + (P.wob || 0);
  if (P.crash) {
    const t = P.crash.t;
    drawDowned(ctx, W / 2 + P.crash.slide, y, bw, PLAYER_LOOK, 0, false);
    const k = Math.min(1, t / 1.0);
    const ry = y - 110 * k - 170 * Math.sin(k * Math.PI) * (0.4 + P.crash.sp * 0.6);
    const rx = W / 2 + P.crash.side * 80 * k;
    const sc = bw * (1 - 0.45 * k);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(rx, y - 110 * k, sc * 0.4, sc * 0.08, 0, 0, TAU); ctx.fill();
    drawRagdoll(ctx, rx, ry - sc * 0.15, sc * 0.9, t < 1 ? t * 11 : 11 + Math.PI / 2 * Math.min(1, t - 1), PLAYER_LOOK);
    return;
  }
  if (P.invuln > 0 && Math.floor(P.invuln * 12) % 2) return;
  const atk = P.attack;
  drawBike(ctx, W / 2, y, bw, Object.assign({}, PLAYER_LOOK, {

}

function engineSound() {
  if (!Snd.ac) return;

    const sp = P.speed / BASE_MAX, g = Math.min(4.99, sp * 5.2), gear = Math.floor(g);
    rpm = sp > 0.96 ? 0.95 + (sp - 0.96) * 0.6 : 0.28 + 0.68 * (g - gear);
    if (R.countdown > 0) rpm = inp('up') ? 0.8 + Math.random() * 0.1 : 0.22;
    if (P.nitroOn) rpm += 0.12;
    vol = P.crash ? 0.03 : R.over ? 0.08 : 0.16;
  } else if (game.state === 'menu') { rpm = 0.45; vol = 0.05; }
  Snd.engine(rpm, vol);
}
function update(dt) {
  if (pressed.mute) { Snd.setMute(!Snd.muted); }
  if (pressed.full) { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); }
  switch (game.state) {
    case 'menu': updateMenu(dt); Snd.musicOn = true; break;
    case 'garage': updateGarage(); break;
    case 'race': updateRace(dt); break;
    case 'pause': updatePause(); break;
    case 'results': updateResults(); break;
  }
  engineSound();
}
function render() {
  if (game.state === 'menu' || game.state === 'garage') { renderMenu(); }
  else {
    ctx.save();
    if (R.shake > 0) ctx.translate((Math.random() - 0.5) * 16 * R.shake, (Math.random() - 0.5) * 12 * R.shake);
    renderWorld(P.d - PLAYER_Z, P.x, drawPlayerBike);
    drawParts();
    ctx.restore();
    drawSpeedFX();
    if (game.state !== 'results') drawHUD();
    if (game.state === 'pause') renderPause();
    if (game.state === 'results') renderResults();
  }
  if (Snd.muted) txt('🔇', W - 30, H - 20, 18, '#fff', 'right', false);
}
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  pollPad();
  while (acc >= STEP) { update(STEP); acc -= STEP; for (const k in pressed) delete pressed[k]; }
  render();
  requestAnimationFrame(frame);
}
buildSprites();
buildTrack('desert');
requestAnimationFrame(frame);
</script>
</body>
</html>
